openapi: 3.1.0
info:
  title: trade-gateway Order Updates API
  version: 1.0.0
  description: |
    対象限定の OpenAPI 契約です。定期同期用の GET /api/order-updates だけを定義し、
    trade-gateway の全 endpoint を網羅する仕様ではありません。利用上の意味論と bot の
    同期手順は ../api-spec.md を参照してください。
servers:
  - url: /
    description: trade-gateway deployment
paths:
  /api/order-updates:
    get:
      operationId: listOrderUpdates
      summary: 注文更新の差分 snapshot を取得する
      description: |
        orders_v2 の updated_at が指定された半開区間に入る注文を、全 lifecycle status
        の現在 snapshot として返します。request 間で snapshot は固定されないため、bot は
        overlap、idempotent upsert、重複排除を行う必要があります。
      security:
        - ApiSecret: []
      parameters:
        - $ref: '#/components/parameters/UpdatedFrom'
        - $ref: '#/components/parameters/UpdatedTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: 注文更新のページ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderUpdatesResponse'
              examples:
                lifecycle-and-commission:
                  summary: 未約定・一部約定・全部約定
                  value:
                    orders:
                      - id: evt-unfilled
                        strategy: MA Crossover
                        broker: bitflyer
                        ticker: BTC_JPY
                        side: BUY
                        order_type: MARKET
                        requested_size: 0.01
                        executed_size: 0
                        executed_price: null
                        fill_status: UNFILLED
                        status: PENDING
                        provider_order_ids: []
                        execution_costs:
                          commission: null
                        exit_sync_status: null
                        created_at: '2026-07-16T00:00:00.000Z'
                        updated_at: '2026-07-16T00:00:00.000Z'
                        executed_at: null
                      - id: evt-partial
                        strategy: MA Crossover
                        broker: bitflyer
                        ticker: BTC_JPY
                        side: BUY
                        order_type: MARKET
                        requested_size: 0.01
                        executed_size: 0.004
                        executed_price: 10000000
                        fill_status: PARTIALLY_FILLED
                        status: PENDING
                        provider_order_ids:
                          - JRF-partial
                        execution_costs:
                          commission: 0
                        exit_sync_status: null
                        created_at: '2026-07-16T00:00:00.000Z'
                        updated_at: '2026-07-16T00:01:00.000Z'
                        executed_at: '2026-07-16T00:00:30.000Z'
                      - id: evt-filled
                        strategy: MA Crossover
                        broker: bitflyer
                        ticker: BTC_JPY
                        side: BUY
                        order_type: IFDOCO
                        requested_size: 0.01
                        executed_size: 0.01
                        executed_price: 10000000
                        fill_status: FILLED
                        status: EXECUTED
                        provider_order_ids:
                          - JRF-filled
                        execution_costs:
                          commission: -0.0001
                        exit_sync_status: MONITORING
                        created_at: '2026-07-16T00:00:00.000Z'
                        updated_at: '2026-07-16T00:02:00.000Z'
                        executed_at: '2026-07-16T00:01:30.000Z'
                    total: 3
                    page: 1
                    limit: 50
                    total_pages: 1
                    updated_from: '2026-07-15T00:00:00.000Z'
                    updated_to: '2026-07-17T00:00:00.000Z'
        '400':
          description: Query parameter または期間が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid-query:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: invalid order updates query
                invalid-period:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: updated_from must be before updated_to
        '401':
          description: Bearer token がない、または不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: invalid or missing token
        '500':
          description: 注文更新の取得に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: failed to fetch order updates
components:
  securitySchemes:
    ApiSecret:
      type: http
      scheme: bearer
      description: API_SECRET と一致する共有 Bearer token
  parameters:
    UpdatedFrom:
      name: updated_from
      in: query
      required: false
      description: |
        範囲の開始時刻。timezone offset を含む ISO 8601 date-time。省略時は updated_to
        または取得時刻から 30 日前。reader の条件は updated_at >= updated_from。
      schema:
        type: string
        format: date-time
        pattern: '(Z|[+-][0-9]{2}:[0-9]{2})$'
      example: '2026-07-15T09:00:00+09:00'
    UpdatedTo:
      name: updated_to
      in: query
      required: false
      description: |
        範囲の終了時刻。timezone offset を含む ISO 8601 date-time。省略時は取得時刻。
        reader の条件は updated_at < updated_to です。
      schema:
        type: string
        format: date-time
        pattern: '(Z|[+-][0-9]{2}:[0-9]{2})$'
      example: '2026-07-16T09:00:00+09:00'
    Limit:
      name: limit
      in: query
      required: false
      description: 1 ページあたりの件数
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    Page:
      name: page
      in: query
      required: false
      description: 1 始まりのページ番号
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
  schemas:
    OrderUpdatesResponse:
      type: object
      additionalProperties: false
      required:
        - orders
        - total
        - page
        - limit
        - total_pages
        - updated_from
        - updated_to
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderUpdate'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 200
        total_pages:
          type: integer
          minimum: 1
        updated_from:
          type: string
          format: date-time
        updated_to:
          type: string
          format: date-time
    OrderUpdate:
      type: object
      additionalProperties: false
      required:
        - id
        - strategy
        - broker
        - ticker
        - side
        - order_type
        - requested_size
        - executed_size
        - executed_price
        - fill_status
        - status
        - provider_order_ids
        - execution_costs
        - exit_sync_status
        - created_at
        - updated_at
        - executed_at
      properties:
        id:
          type: string
        strategy:
          type: string
        broker:
          type: string
          enum: [bitflyer, dummy, saxo]
        ticker:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        order_type:
          type: string
          enum: [MARKET, IFDOCO, LIMIT, STOP]
        requested_size:
          type: number
        executed_size:
          type: number
        executed_price:
          type: [number, 'null']
        fill_status:
          type: string
          enum: [UNFILLED, PARTIALLY_FILLED, FILLED]
        status:
          type: string
          enum: [PENDING, EXECUTED, FAILED, CANCELED]
        provider_order_ids:
          type: array
          items:
            type: string
        execution_costs:
          type: object
          additionalProperties: false
          required: [commission]
          properties:
            commission:
              type: [number, 'null']
              description: 明示的な broker execution commission。null は unknown。
        exit_sync_status:
          type: [string, 'null']
          enum: [MONITORING, COMPLETED, null]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        executed_at:
          type: [string, 'null']
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHORIZED, INTERNAL_ERROR]
            message:
              type: string
