services:

  api:
    image: node:24-trixie
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    working_dir: /app
    environment:
      - FIRESTORE_EMULATOR_HOST=test-firebase:8080
      - GOOGLE_CLOUD_PROJECT=trade-gateway
    networks:
      - default
      - firebase
    command: bash -c "npm install && npm run dev:api"

  ui:
    image: node:24-trixie
    volumes:
      - .:/app
      - ui-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - API_URL=
      - API_SECRET=

    working_dir: /app
    networks:
      - default
    command: bash -c "npm install && npm run dev:ui"

volumes:
  api-node-modules:
  ui-node-modules:

networks:
  firebase:
    name: firebase
    external: true
  reverse-proxy:
    name: reverse-proxy
    external: true
