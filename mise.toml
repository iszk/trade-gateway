[tools]
gcloud = "latest"
node = "24"

[env]
# 基本的にはテスト用の環境変数を記載
GCLOUD_PROJECT = "tradegatewaytest"
FIRESTORE_EMULATOR_HOST = "test-firebase:8080"
# 本番デプロイ用
DEPLOY_GOOGLE_CLOUD_PROJECT = "trade-gateway-1"

[tasks.setup]
description = "Set up the project by installing dependencies"
run = "npm ci"

[tasks.dev]
description = "Start the API development server"
run = "npm run dev:api"

[tasks."dev:ui"]
description = "Start the UI development server"
run = "npm run dev:ui"

[tasks.build]
description = "Build all workspace applications"
run = "npm run build"

[tasks.typecheck]
description = "Run type checking for all workspaces"
run = "npm run typecheck"

[tasks.check]
depends = ["typecheck"]
description = "Run static project checks"
run = "npm run lint:unused"

[tasks.test]
description = "Run all workspace tests"
run = "npm run test"
